server.port=8080

# --- Base de datos SQLite ---
spring.datasource.url=jdbc:sqlite:data/DB_presta_expres.sqlite?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite solo admite un escritor a la vez
spring.datasource.hikari.maximum-pool-size=1

# Rechaza JSON con campos que no existen en el DTO (evita que alguien envíe "idRol")
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- JWT (cambiar el secreto en producción; mínimo 32 caracteres) ---
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres-ok}
app.jwt.expiration-minutes=60

# --- Administrador inicial (se crea al arrancar si no existe) ---
app.admin.email=admin@prestaexpress.com
app.admin.password=${ADMIN_PASSWORD:Admin#2026Pe}
app.admin.telefono=5500000000
